[package]
name = "opencad-help"
version = "0.1.0"
edition = "2021"
description = "Opens the bundled OCS Commands PDF in Open CAD Studio."
license = "GPL-3.0-only"

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin the exact OCS source used by the host build. Rust trait-object ABI is not
# stable, so a floating branch is not safe for native plugin releases.
ocs_plugin_api = { git = "https://github.com/felixriestra/OpenCADStudio.git", rev = "612124b84b84e6817883774f5bf1bef9ba48c67f", features = ["host"] }
