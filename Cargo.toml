[package]
name = "opencad-help"
version = "0.2.0"
edition = "2021"
description = "Opens the bundled OCS Commands PDF in Open CAD Studio."
license = "GPL-3.0-only"

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin the exact OCS source used by the host build. Rust trait-object ABI is not
# stable, so a floating branch is not safe for native plugin releases.
ocs_plugin_api = { git = "https://github.com/felixriestra/OpenCADStudio.git", rev = "ca0ee37d266051cee8c4ead13bfb425e6531bf0c", features = ["host"] }
